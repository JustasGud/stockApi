# Application port
server.port=8080

# H2 database configuration
spring.datasource.url=jdbc:h2:mem:stockdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Shows the H2 database console in browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Automatically creates/updates database tables from Java entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows generated SQL in console
spring.jpa.show-sql=true

# Makes SQL output easier to read
spring.jpa.properties.hibernate.format_sql=true